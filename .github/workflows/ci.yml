name: Calculator CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t calculator-app .

      - name: Run container
        run: |
          docker run -d -p 8080:80 --name calculator-container calculator-app
          sleep 5

      - name: Check container
        run: docker ps -a

      - name: Check container logs
        run: docker logs calculator-container

      - name: Test application
        run: curl -v http://localhost:8080