name: Calculator CI

on:
  push:
    branches:
      - main

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t calculator-app .

      - name: Run container
        run: docker run -d -p 8080:80 --name calculator-container calculator-app
          sleep 5

      - name: Test Application
        run: curl http://localhost:8080